<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NeonWeb3 Marketplace</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      background: #0d0d0d;
      color: #0ff;
      font-family: "Orbitron", sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2rem;
      margin: 2rem 0;
    }
    .neon-border {
      border: 2px solid #0ff;
      box-shadow: 0 0 15px #0ff;
    }
    .hover-scale {
      transition: transform 0.3s ease;
    }
    .hover-scale:hover {
      transform: scale(1.05);
    }
    .wallet-btn {
      background: linear-gradient(45deg, #0ff, #0080ff);
      border: none;
      border-radius: 50px;
      padding: 8px 20px;
      font-weight: bold;
      color: #0d0d0d;
    }
    .network-indicator {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      margin-left: 8px;
    }
    .testnet {
      background-color: #ff9900;
      color: #000;
    }
    .mainnet {
      background-color: #00cc66;
      color: #000;
    }
    .nft-card,
    .product-card {
      background: linear-gradient(
        135deg,
        rgba(0, 255, 255, 0.1),
        rgba(0, 128, 255, 0.1)
      );
      border-radius: 15px;
      border: 1px solid rgba(0, 255, 255, 0.3);
      padding: 15px;
      margin-bottom: 20px;
      transition: all 0.3s;
    }
    .nft-card:hover,
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 255, 255, 0.2);
    }
    .nft-image,
    .product-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .network-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 0.8rem;
    }
    .testnet-badge {
      background: rgba(255, 153, 0, 0.2);
    }
    .mainnet-badge {
      background: rgba(0, 204, 102, 0.2);
    }
    .network-toggle {
      position: fixed;
      top: 80px;
      right: 20px;
      z-index: 1000;
    }
    .network-toggle-btn {
      margin: 0 2px;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .network-toggle-btn.active {
      box-shadow: 0 0 10px #0ff;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><i class="bi bi-coin"></i> NeonWeb3</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="#nft">NFTs</a></li>
          <li class="nav-item"><a class="nav-link" href="#products">Products</a></li>
          <li class="nav-item ms-3">
            <button
              class="wallet-btn"
              id="connectWalletBtn"
            >
              <i class="bi bi-wallet2"></i> Connect Wallet
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Network Toggle -->
  <div class="network-toggle">
    <span
      class="network-toggle-btn testnet active"
      data-network="testnet"
      >Testnet</span
    >
    <span class="network-toggle-btn mainnet" data-network="mainnet"
      >Mainnet</span
    >
  </div>

  <!-- NFT Section -->
  <section id="nft" class="glass position-relative">
    <div class="container">
      <h2 class="text-center mb-4"><i class="bi bi-image"></i> NFT Marketplace</h2>
      <div class="row" id="nftContainer"></div>
    </div>
  </section>

  <!-- Products Section -->
  <section id="products" class="glass position-relative">
    <div class="container">
      <h2 class="text-center mb-4"><i class="bi bi-bag"></i> Products</h2>
      <div class="row" id="productsContainer"></div>
    </div>
  </section>

  <footer class="text-center glass py-4">
    <p>&copy; 2025 NeonWeb3 Marketplace. Built on Ethereum.</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>

  <script>
    // -------------------------
    // App State & Sample Data
    // -------------------------
    const appState = {
      currentNetwork: "testnet",
      provider: null,
      signer: null,
      address: null,
      testnetItems: [
        {
          id: 1,
          name: "Cosmic Dreams #001",
          description: "A beautiful cosmic NFT",
          image: "https://picsum.photos/seed/cosmic1/400/300.jpg",
          price: "0.05",
          category: "NFT",
          network: "testnet",
        },
        {
          id: 2,
          name: "Legendary Sword",
          description: "Powerful gaming sword",
          image: "https://picsum.photos/seed/sword/400/300.jpg",
          price: "0.12",
          category: "Product",
          network: "testnet",
        },
      ],
      mainnetItems: [
        {
          id: 101,
          name: "Premium NFT #101",
          description: "Exclusive mainnet collectible",
          image: "https://picsum.photos/seed/premium1/400/300.jpg",
          price: "1.0",
          category: "NFT",
          network: "mainnet",
        },
        {
          id: 102,
          name: "Luxury Virtual Estate",
          description: "High-end property",
          image: "https://picsum.photos/seed/estate/400/300.jpg",
          price: "5.0",
          category: "Product",
          network: "mainnet",
        },
      ],
    };

    // -------------------------
    // UTILITIES
    // -------------------------
    function saveNetworkChoice() {
      localStorage.setItem("nw_choice", appState.currentNetwork);
    }

    function loadNetworkChoice() {
      const nw = localStorage.getItem("nw_choice");
      if (nw === "mainnet" || nw === "testnet") {
        appState.currentNetwork = nw;
      }
    }

    // -------------------------
    // RENDERING
    // -------------------------
    function renderItems() {
      const all =
        appState.currentNetwork === "testnet"
          ? appState.testnetItems
          : appState.mainnetItems;
      const nfts = all.filter((i) => i.category === "NFT");
      const prods = all.filter((i) => i.category === "Product");

      const nftC = document.getElementById("nftContainer");
      const prodC = document.getElementById("productsContainer");
      nftC.innerHTML = "";
      prodC.innerHTML = "";

      nfts.forEach((i) => nftC.appendChild(makeCard(i)));
      prods.forEach((i) => prodC.appendChild(makeCard(i)));
    }

    function makeCard(item) {
      const col = document.createElement("div");
      col.className = "col-md-4 mb-4 position-relative";
      col.innerHTML = `
        <span class="network-badge ${
          item.network === "testnet" ? "testnet-badge" : "mainnet-badge"
        }">${item.network}</span>
        <div class="${item.category.toLowerCase()}-card">
          <img src="${item.image}" class="${
        item.category.toLowerCase()
      }-image" />
          <h5>${item.name}</h5>
          <p>${item.description}</p>
          <div class="d-flex justify-content-between align-items-center">
            <span>${item.price} ETH</span>
            <button class="btn btn-primary hover-scale buy-btn" data-id="${
              item.id
            }">Buy</button>
          </div>
        </div>
      `;
      return col;
    }

    // -------------------------
    // WALLET CONNECTION
    // -------------------------
    async function connectWallet(type) {
      try {
        if (type === "walletconnect") {
          // WALLETCONNECT → Ethers provider
          const wcProvider = new WalletConnectProvider.default({
            infuraId: "YOUR_INFURA_ID", // ← replace with your Infura ID
          });
          await wcProvider.enable();
          appState.provider = new ethers.providers.Web3Provider(wcProvider);
        } else {
          // ANY injected wallet (MetaMask, Rabby, Bybit, Bitget, etc.)
          if (!window.ethereum)
            throw new Error("No injected wallet found in your browser");
          appState.provider = new ethers.providers.Web3Provider(
            window.ethereum,
            "any"
          );
          // request access
          await window.ethereum.request({
            method: "eth_requestAccounts",
          });
        }

        appState.signer = appState.provider.getSigner();
        appState.address = await appState.signer.getAddress();

        // update UI
        document.getElementById(
          "connectWalletBtn"
        ).innerHTML = `<i class="bi bi-wallet2"></i> ${appState.address.slice(
          0,
          6
        )}...${appState.address.slice(-4)}`;

        renderItems();
      } catch (err) {
        console.error(err);
        alert("Failed to connect wallet. " + err.message);
      }
    }

    // -------------------------
    // NETWORK TOGGLE
    // -------------------------
    function setupNetworkToggle() {
      loadNetworkChoice();
      document
        .querySelectorAll(".network-toggle-btn")
        .forEach((btn) => {
          const nw = btn.getAttribute("data-network");
          btn.classList.toggle("active", nw === appState.currentNetwork);
          btn.addEventListener("click", () => {
            appState.currentNetwork = nw;
            saveNetworkChoice();
            document
              .querySelectorAll(".network-toggle-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            renderItems();
          });
        });
    }

    // -------------------------
    // BUY BUTTON
    // -------------------------
    document.addEventListener("click", (e) => {
      if (e.target.classList.contains("buy-btn")) {
        if (!appState.address) {
          return alert("Please connect wallet first");
        }
        const id = e.target.getAttribute("data-id");
        alert(
          `Pretend we're sending a tx to purchase item #${id} on ${appState.currentNetwork}`
        );
      }
    });

    // -------------------------
    // BOOTSTRAP EVENT HANDLERS
    // -------------------------
    document
      .getElementById("connectWalletBtn")
      .addEventListener("click", () =>
        connectWallet("injected")
      ); /* treat all injected wallets the same */
    // if you want walletconnect option:
    // document.getElementById('someWCBtn').addEventListener('click', ()=>connectWallet('walletconnect'))

    // -------------------------
    // ON LOAD
    // -------------------------
    window.addEventListener("DOMContentLoaded", () => {
      setupNetworkToggle();
      renderItems();
    });
  </script>
</body>
</html>
