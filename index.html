<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NeonWeb3 Marketplace</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <style>
    body {
      background: #0d0d0d;
      color: #0ff;
      font-family: sans-serif;
    }
    .glass {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 1.5rem;
      margin: 1.5rem 0;
    }
    .neon-border {
      border: 2px solid #0ff;
      box-shadow: 0 0 10px #0ff;
    }
    .wallet-btn, .admin-btn {
      background: #0ff;
      border: none;
      border-radius: 50px;
      color: #000;
      font-weight: bold;
    }
    .network-toggle {
      position: fixed;
      top: 100px;
      right: 20px;
      z-index: 1000;
    }
    .network-toggle button {
      margin: 0 4px;
    }
    .network-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 8px;
      background: rgba(0,255,255,0.2);
      border-radius: 8px;
      font-size: 0.75rem;
    }
    .network-badge.mainnet { background: rgba(0,204,102,0.2); }
    .network-badge.testnet { background: rgba(255,153,0,0.2); }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand"><i class="bi bi-coin"></i> NeonWeb3</a>
      <div>
        <button class="btn admin-btn me-2" id="adminLoginBtn">
          <i class="bi bi-shield-lock"></i> Admin Login
        </button>
        <button class="btn wallet-btn" id="connectWalletBtn">
          <i class="bi bi-wallet2"></i> Connect Wallet
        </button>
      </div>
    </div>
  </nav>

  <!-- NETWORK TOGGLE -->
  <div class="network-toggle">
    <button class="btn btn-outline-light" data-net="testnet">Testnet</button>
    <button class="btn btn-outline-light" data-net="mainnet">Mainnet</button>
  </div>

  <!-- NFT SECTION -->
  <section id="nft" class="glass position-relative">
    <h2>NFT Marketplace</h2>
    <div class="row" id="nftContainer"></div>
  </section>

  <!-- PRODUCTS SECTION -->
  <section id="products" class="glass position-relative">
    <h2>Products</h2>
    <div class="row" id="prodContainer"></div>
  </section>

  <!-- ADMIN PANEL -->
  <section id="adminPanel" class="glass neon-border" style="display:none;">
    <h2>Admin Dashboard</h2>
    <p>Network is currently: <strong id="adminNetwork"></strong></p>
    <button class="btn btn-danger" id="adminLogoutBtn">Logout Admin</button>
  </section>

  <!-- ADMIN LOGIN MODAL -->
  <div class="modal fade" id="adminModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content glass neon-border">
        <div class="modal-header">
          <h5 class="modal-title">Admin Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="adminForm">
            <div class="mb-3">
              <label>Username</label>
              <input type="text" id="adminUser" class="form-control" required />
            </div>
            <div class="mb-3">
              <label>Password</label>
              <input type="password" id="adminPass" class="form-control" required />
            </div>
            <button class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="text-center py-3">
    &copy; 2025 NeonWeb3
  </footer>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
  <script>
    // ── APP STATE ────────────────────────────────────────
    const state = {
      network: localStorage.getItem('nw') || 'testnet',
      walletAddress: localStorage.getItem('addr') || null,
      adminLoggedIn: localStorage.getItem('admin') === '1',
      adminCreds: { user:'admin', pass:'admin123' },
      testnetItems: [
        { id:1,name:'Cosmic #1',desc:'Testnet NFT',img:'https://picsum.photos/seed/a/400/300',price:'0.05',cat:'NFT',net:'testnet' }
      ],
      mainnetItems: [
        { id:101,name:'Premium #1',desc:'Mainnet NFT',img:'https://picsum.photos/seed/b/400/300',price:'1.0',cat:'NFT',net:'mainnet' }
      ]
    };

    // ── HELPERS ─────────────────────────────────────────
    function saveState(){
      localStorage.setItem('nw',state.network);
      state.walletAddress
        ? localStorage.setItem('addr',state.walletAddress)
        : localStorage.removeItem('addr');
      localStorage.setItem('admin', state.adminLoggedIn ? '1':'0');
    }

    // ── RENDERING ───────────────────────────────────────
    function renderNetworkToggle(){
      document.querySelectorAll('.network-toggle button').forEach(b=>{
        b.classList.toggle('active',b.dataset.net===state.network);
      });
    }
    function renderItems(){
      const containerNFT = document.getElementById('nftContainer');
      const containerP = document.getElementById('prodContainer');
      containerNFT.innerHTML=''; containerP.innerHTML='';
      const items = state.network==='testnet' ? state.testnetItems : state.mainnetItems;
      items.forEach(i=>{
        const col = document.createElement('div');
        col.className='col-md-4 mb-3 position-relative';
        col.innerHTML=`
          <span class="network-badge ${i.net}">${i.net}</span>
          <div class="glass">
            <img src="${i.img}" class="img-fluid mb-2" />
            <h5>${i.name}</h5>
            <p>${i.desc}</p>
            <div class="d-flex justify-content-between">
              <span>${i.price} ETH</span>
              <button class="btn btn-sm btn-primary buy" data-id="${i.id}">Buy</button>
            </div>
          </div>`;
        if(i.cat==='NFT') containerNFT.append(col);
        else containerP.append(col);
      });
    }
    function renderWalletBtn(){
      const btn = document.getElementById('connectWalletBtn');
      if(state.walletAddress){
        btn.innerHTML = `<i class="bi bi-wallet2"></i> ${state.walletAddress.slice(0,6)}…${state.walletAddress.slice(-4)}`;
      } else {
        btn.innerHTML = `<i class="bi bi-wallet2"></i> Connect Wallet`;
      }
    }
    function renderAdminPanel(){
      document.getElementById('adminPanel').style.display = state.adminLoggedIn?'block':'none';
      if(state.adminLoggedIn){
        document.getElementById('adminNetwork').innerText = state.network;
      }
    }

    // ── WALLET CONNECT ─────────────────────────────────
    async function connectWallet() {
      try {
        let provider;
        // If user wants WalletConnect, you'd call:
        // const wc = new WalletConnectProvider.default({ infuraId:'YOUR_INFURA_ID' });
        // await wc.enable();
        // provider = new ethers.providers.Web3Provider(wc);
        // For now, we just use injected (MetaMask, Rabby, Bybit, etc.)
        if(!window.ethereum) throw new Error('No injected wallet found');
        provider = new ethers.providers.Web3Provider(window.ethereum, 'any');
        // Request accounts
        await provider.send('eth_requestAccounts', []);
        const signer = provider.getSigner();
        const addr = await signer.getAddress();
        state.walletAddress = addr;
        saveState();
        renderWalletBtn();
      } catch(e){
        console.error(e);
        alert('Failed to connect wallet: '+ e.message);
      }
    }

    // ── ADMIN LOGIN ────────────────────────────────────
    function tryAdminLogin(e){
      e.preventDefault();
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;
      if(u===state.adminCreds.user && p===state.adminCreds.pass){
        state.adminLoggedIn = true;
        saveState();
        renderAdminPanel();
        const modal = bootstrap.Modal.getInstance(document.getElementById('adminModal'));
        modal.hide();
      } else {
        alert('Invalid admin credentials');
      }
    }
    function adminLogout(){
      state.adminLoggedIn = false;
      saveState();
      renderAdminPanel();
    }

    // ── EVENT BINDING & INIT ──────────────────────────
    window.addEventListener('DOMContentLoaded',()=>{
      // Network toggle
      document.querySelectorAll('.network-toggle button').forEach(b=>{
        b.addEventListener('click',()=>{
          state.network = b.dataset.net;
          saveState();
          renderNetworkToggle();
          renderItems();
          renderAdminPanel();
        });
      });
      renderNetworkToggle();

      // Buy buttons
      document.body.addEventListener('click',ev=>{
        if(ev.target.classList.contains('buy')){
          if(!state.walletAddress) return alert('Please connect wallet first');
          const id = ev.target.dataset.id;
          alert(`Would send tx to buy item #${id} on ${state.network}`);
        }
      });

      // Wallet connect
      document.getElementById('connectWalletBtn')
        .addEventListener('click',connectWallet);
      renderWalletBtn();

      // Admin login flow
      document.getElementById('adminLoginBtn')
        .addEventListener('click',()=>{
          new bootstrap.Modal(document.getElementById('adminModal')).show();
        });
      document.getElementById('adminForm')
        .addEventListener('submit', tryAdminLogin);
      document.getElementById('adminLogoutBtn')
        .addEventListener('click', adminLogout);

      // Render initial items & admin
      renderItems();
      renderAdminPanel();
    });
  </script>
</body>
</html>
